name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - uses: actions/setup-node@v4
        with:
          # The demo page's scoring JavaScript is executed by tests/test_browser_parity.py
          # and compared to scikit-learn, so Node is a test dependency, not a build one.
          node-version: "20"

      - name: Test
        # Fraud.csv is a 470 MB gitignored download, so the suite builds its own
        # PaySim-shaped fixtures and runs in seconds without it.
        run: pytest

  docker:
    name: docker image builds and its tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fraud-detection:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the suite inside the image
        # The image's default CMD is pytest, so this proves the container is a
        # working environment rather than merely a layer that built.
        run: docker run --rm fraud-detection:ci
